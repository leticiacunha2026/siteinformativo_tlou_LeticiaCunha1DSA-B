<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="img/vagalume.jpg">
</head>

<body>
  <header class="navbar">
    <div class="container nav-content">
      <a href="index.html" class="logo">THE LAST OF US <span>//MANUAL DO FÃ</span></a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Início</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="codex.html">Codex</a></li>
          <li><a href="ajuda.html">Ajuda</a></li>
          <li><a href="contato.html" class="active">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <section class="container section">
    <div class="section-header">
      <h2>CONTATO // CANAL DE COMUNICAÇÃO</h2>
      <div class="line"></div>
    </div>

    <div class="contact-box">


      <form action="#" method="POST" class="tlou-form">
        <div class="form-group">
          <label for="nome">Codinome ou Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Joel Miller" required>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="sobrevivente@vagalumes.org" required>
        </div>

        <div class="form-group">
          <label for="assunto">Assunto</label>
          <select id="assunto" name="assunto">
            <option value="sugestao">Sugestão para o Codex</option>
            <option value="correcao">Correção de Informação</option>
            <option value="duvida">Dúvida Geral</option>
          </select>
        </div>

        <div class="form-group">
          <label for="mensagem">Mensagem <span
              style="color: var(--text-muted); font-size: 0.85rem; font-weight: normal;">(Opcional)</span></label>
          <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..."></textarea>
        </div>

        <button type="submit" class="btn-submit">ENVIAR TRANSMISSÃO</button>
      </form>
    </div>
  </section>
    <footer class="footer">
    <div class="container">
      <p>Letícia Cunha 2026-© Todos os direitos reservados <br> Trabalho acadêmico sem fins lucrativos</p>
    </div>
  </footer>
</body>

</html>
